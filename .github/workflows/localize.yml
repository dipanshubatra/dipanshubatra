name: Localize images

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Self-host new external images, then refresh existing ones
        run: |
          python3 scripts/localize.py localize
          python3 scripts/localize.py refresh

      - name: Generate GitHub stats card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/gen_stats.py

      - name: Regenerate analytics pieces
        run: python3 scripts/gen_analytics.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Refresh profile images and stats" && git pull -q --rebase && git push)
