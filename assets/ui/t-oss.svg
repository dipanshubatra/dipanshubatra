<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="82" viewBox="0 0 1000 82">
<defs>
 <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffdf7"/><stop offset="1" stop-color="#f6f1e7"/></linearGradient>
 <clipPath id="sheet"><rect x="2" y="2" width="996" height="78" rx="9"/></clipPath>
</defs>
<style>
 text{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif}
 .title{animation:titleIn .8s cubic-bezier(.2,.75,.25,1) both}
 .ink{fill:none;stroke:#ff9f45;stroke-width:5.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:inkDraw 5.8s ease-in-out infinite}
 .ink2{fill:none;stroke:#ff9f45;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:inkDraw2 5.8s ease-in-out infinite}
 .pencil{transform-box:fill-box;transform-origin:center;animation:pencilMove 5.8s ease-in-out infinite}
 .doodle{transform-box:fill-box;transform-origin:center;animation:doodle 3.8s ease-in-out infinite}
 .shine{animation:underlineShine 5.8s ease-in-out infinite}
 @keyframes titleIn{0%{opacity:0;transform:translateX(-14px)}100%{opacity:1;transform:translateX(0)}}
 @keyframes inkDraw{0%,8%{stroke-dashoffset:1;opacity:0}12%{opacity:1}34%,72%{stroke-dashoffset:0;opacity:1}88%,100%{stroke-dashoffset:1;opacity:0}}
 @keyframes inkDraw2{0%,24%{stroke-dashoffset:1;opacity:0}30%{opacity:.9}48%,72%{stroke-dashoffset:0;opacity:.9}88%,100%{stroke-dashoffset:1;opacity:0}}
 @keyframes pencilMove{0%,8%{opacity:0;transform:translateX(0) rotate(-8deg)}12%{opacity:1}34%{transform:translateX(192.5px) rotate(3deg);opacity:1}38%,72%{opacity:0;transform:translateX(192.5px) rotate(3deg)}100%{opacity:0;transform:translateX(0)}}
 @keyframes doodle{0%,100%{transform:rotate(-4deg) scale(1)}50%{transform:rotate(5deg) scale(1.06)}}
 @keyframes underlineShine{0%,35%{opacity:0}45%,58%{opacity:.7}72%,100%{opacity:0}}
 @media(prefers-reduced-motion:reduce){.title,.ink,.ink2,.pencil,.doodle,.shine{animation:none}.ink,.ink2{stroke-dashoffset:0;opacity:1}}
</style>
<g clip-path="url(#sheet)">
 <rect x="2" y="2" width="996" height="78" rx="9" fill="url(#paper)"/>
 <path d="M3 25 H997 M3 54 H997 M3 75 H997" stroke="#c9d3ea" stroke-width="1.1" opacity=".9"/>
 <path d="M120 2 V80" stroke="#ff6b6b" stroke-width="1.6" opacity=".8"/>
 <path d="M2 2 H998 V80 H2Z" fill="none" stroke="#15151a" stroke-width="2.4"/>
 <g class="title"><text x="144" y="49" font-size="31" font-weight="850" letter-spacing="-.5" fill="#15151a">Open Source</text></g>
 <path class="ink" pathLength="1" d="M140 59 Q 240.1 65 332.5 58"/>
 <path class="ink2" pathLength="1" d="M146 65 Q 243.1 69 325.5 64"/>
 <g class="pencil" transform="translate(0 0)">
  <g transform="translate(0 0) rotate(-12 0 0)">
   <path d="M0 0 L17 -4 L21 2 L4 7 Z" fill="#ffe14d" stroke="#15151a" stroke-width="1.5"/>
   <path d="M17 -4 L21 2 L25 0 L21 -6 Z" fill="#ffb6a3" stroke="#15151a" stroke-width="1.2"/>
   <path d="M0 0 L4 7 L-3 9 Z" fill="#15151a"/>
   <path d="M5 1 L17 -2" stroke="#fffdf7" stroke-width="1.2"/>
  </g>
 </g>
 <g class="doodle" transform="translate(922 40)">
  <path d="M0 -17 L4 -5 L16 0 L4 4 L0 17 L-4 4 L-16 0 L-4 -5Z" fill="#ff9f45" fill-opacity=".55" stroke="#15151a" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M28 -12 Q35 -19 41 -11 Q46 -3 36 2" fill="none" stroke="#ff9f45" stroke-width="2.8" stroke-linecap="round"/>
 </g>
 <path class="shine" d="M140 58 Q 240.1 63 332.5 57" fill="none" stroke="#fffdf7" stroke-width="1.7" stroke-linecap="round"/>
</g></svg>