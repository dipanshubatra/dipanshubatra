<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="82" viewBox="0 0 1000 82">
<defs>
 <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffdf7"/><stop offset="1" stop-color="#f6f1e7"/></linearGradient>
 <linearGradient id="underline" x1="0" x2="1"><stop stop-color="#c4a7ff"/><stop offset=".62" stop-color="#38bdf8" stop-opacity=".78"/><stop offset="1" stop-color="#38bdf8" stop-opacity=".08"/></linearGradient>
 <linearGradient id="pencilBody" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffe88a"/><stop offset="1" stop-color="#ffbd45"/></linearGradient>
 <clipPath id="sheet"><rect x="2" y="2" width="996" height="78" rx="9"/></clipPath></defs>
<style>
 text{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif}
 .title{animation:titleIn .72s cubic-bezier(.2,.75,.25,1) both}
 .ink{fill:none;stroke:#c4a7ff;stroke-width:5.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:inkDraw 6s ease-in-out infinite}
 .ink2{fill:none;stroke:#38bdf8;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:inkDraw2 6s ease-in-out infinite}
 .pencil{transform-box:fill-box;transform-origin:center;animation:pencilMove 6s ease-in-out infinite}
 .doodle{transform-box:fill-box;transform-origin:center;animation:doodle 4s ease-in-out infinite}
 .shine{opacity:0;animation:underlineShine 6s ease-in-out infinite}
 @keyframes titleIn{0%{opacity:0;transform:translateX(-12px)}100%{opacity:1;transform:translateX(0)}}
 @keyframes inkDraw{0%,8%{stroke-dashoffset:1;opacity:0}13%{opacity:1}35%,72%{stroke-dashoffset:0;opacity:1}88%,100%{stroke-dashoffset:1;opacity:0}}
 @keyframes inkDraw2{0%,22%{stroke-dashoffset:1;opacity:0}29%{opacity:.9}48%,72%{stroke-dashoffset:0;opacity:.9}88%,100%{stroke-dashoffset:1;opacity:0}}
 @keyframes pencilMove{0%,8%{opacity:0;transform:translateX(0) rotate(-8deg)}13%{opacity:1}35%{transform:translateX(172px) rotate(3deg);opacity:1}39%,72%{opacity:0;transform:translateX(172px) rotate(3deg)}100%{opacity:0;transform:translateX(0)}}
 @keyframes doodle{0%,100%{transform:rotate(-5deg) scale(1)}50%{transform:rotate(5deg) scale(1.07)}}
 @keyframes underlineShine{0%,38%{opacity:0}47%,58%{opacity:.7}72%,100%{opacity:0}}
 @media(prefers-reduced-motion:reduce){.title,.ink,.ink2,.pencil,.doodle,.shine{animation:none}.ink,.ink2{stroke-dashoffset:0;opacity:1}}
 </style>
<g clip-path="url(#sheet)"><rect x="8" y="8" width="990" height="72" rx="10" fill="#c4a7ff" stroke="#15151a" stroke-width="2.8"/>
 <rect x="2" y="2" width="990" height="72" rx="10" fill="url(#paper)" stroke="#15151a" stroke-width="2.8"/>
 <path d="M3 27 H991 M3 54 H991" stroke="#c9d3ea" stroke-width="1.05"/>
 <path d="M120 3 V73" stroke="#ff6b6b" stroke-width="1.55" opacity=".85"/>
 <path d="M142 43 Q 272.6 39 414.0 43" fill="none" stroke="#c4a7ff" stroke-width="17" stroke-linecap="round" opacity=".30"/>
 <g class="title"><text x="142" y="49" font-size="31" font-weight="850" letter-spacing="-.5" fill="#15151a">GitHub Analytics</text></g>
 <path class="ink" pathLength="1" d="M140 59 Q 222 65 316 58"/>
 <path class="ink2" pathLength="1" d="M146 65 Q 228 69 309 64"/>
 <g transform="translate(140 60)"><g class="pencil"><g transform="translate(0 0) rotate(-12 0 0)"><path d="M0 0 L17 -4 L21 2 L4 7 Z" fill="url(#pencilBody)" stroke="#15151a" stroke-width="1.4"/><path d="M17 -4 L21 2 L25 0 L21 -6 Z" fill="#ffb6a3" stroke="#15151a" stroke-width="1.1"/><path d="M0 0 L4 7 L-3 9 Z" fill="#15151a"/><path d="M5 1 L17 -2" stroke="#fffdf7" stroke-width="1.1"/></g></g></g>
 <g transform="translate(948 39)"><g class="doodle"><path d="M0 -14 L4 -4 L14 0 L4 4 L0 14 L-4 4 L-14 0 L-4 -4Z" fill="#38bdf8" fill-opacity=".7" stroke="#15151a" stroke-width="1.7" stroke-linejoin="round"/><path d="M-26 -12 Q-32 -19 -38 -11 M26 12 Q32 19 38 11" fill="none" stroke="#c4a7ff" stroke-width="2.5" stroke-linecap="round"/></g></g>
 <path class="shine" d="M140 58 Q 222 63 316 57" fill="none" stroke="#fffdf7" stroke-width="1.6" stroke-linecap="round"/></g></svg>