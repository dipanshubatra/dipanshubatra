    <linearGradient id="base" x1="0" x2="1"><stop stop-color="#64748b"/><stop offset="1" stop-color="#94a3b8"/></linearGradient></defs><style>text{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif}.m{font-family:'Fira Code','SFMono-Regular',Consolas,'DejaVu Sans Mono',monospace}@keyframes grow{from{width:0}to{width:var(--w)}}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}.live{animation:pulse 3s ease-in-out infinite}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1000" height="260" rx="18" fill="url(#bg)" stroke="#263449"/><text class="m" x="28" y="28" font-size="10" letter-spacing="2" fill="#64748b">JMETER / LOAD-TEST SNAPSHOT</text><text x="28" y="67" font-size="27" font-weight="800" fill="#e2e8f0">Cache changes the throughput curve.</text><text x="28" y="91" font-size="11.5" fill="#94a3b8">Previously measured benchmark · 1,000 virtual users × 50 loops · 50,000 requests</text><text class="m" x="28" y="133" font-size="11" fill="#67e8f9">REDIS CACHE ENABLED</text><rect x="230" y="116" width="600" height="24" rx="7" fill="#172334"/><rect class="live" x="230" y="116" width="600" height="24" rx="7" fill="url(#cache)"/><text x="850" y="135" font-size="16" font-weight="800" fill="#67e8f9">~1,808 req/s</text><text class="m" x="28" y="177" font-size="11" fill="#94a3b8">CACHE DISABLED</text><rect x="230" y="160" width="600" height="24" rx="7" fill="#172334"/><rect x="230" y="160" width="33" height="24" rx="7" fill="url(#base)"/><text x="850" y="179" font-size="16" font-weight="800" fill="#cbd5e1">~100 req/s</text><line x1="28" y1="205" x2="972" y2="205" stroke="#263449"/><text class="m" x="28" y="232" font-size="10" fill="#4ade80">0% ERRORS</text><text class="m" x="240" y="232" font-size="10" fill="#94a3b8">AVG RESPONSE: 361 ms (cached run)</text><text class="m" x="972" y="232" text-anchor="end" font-size="10" fill="#64748b">BENCHMARK SNAPSHOT · NOT LIVE TELEMETRY</text></svg>