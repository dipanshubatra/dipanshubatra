    <g transform="translate(0 50)"><g class="w w0" opacity="0.18"><path d="M0 40 Q125 0 250 40 T500 40 T750 40 T1000 40 T1250 40 T1500 40 T1750 40 T2000 40 T2250 40 T2500 40 V200 H0 Z" fill="url(#wg)"/></g></g>
