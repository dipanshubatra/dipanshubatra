><text x="436" y="41.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4ade80">LIVE</text><text x="28" y="82" font-size="26" font-weight="800" fill="#f1f5f9">CronVault</text><text x="28" y="106" font-size="13.5" fill="#94a3b8">Multi-tenant distributed job scheduler</text><line class="ln" x1="28" y1="122" x2="462" y2="122" stroke="#f472b6" stroke-opacity=".5"/><rect x="28" y="138" width="136" height="62" rx="12" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".08"/><text x="96" y="168" text-anchor="middle" font-size="22" font-weight="800" fill="#f472b6">1x</text><text x="96" y="188" text-anchor="middle" font-size="11" fill="#94a3b8">exactly-once runs</text><rect x="176" y="138" width="136" height="62" rx="12" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".08"/><text x="244" y="168" text-anchor="middle" font-size="22" font-weight="800" fill="#f472b6">9</text><text x="244" y="188" text-anchor="middle" font-size="11" fill="#94a3b8">RBAC permissions</text><rect x="324" y="138" width="136" height="62" rx="12" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".08"/><text x="392" y="168" text-anchor="middle" font-size="22" font-weight="800" fill="#f472b6">60s</text><text x="392" y="188" text-anchor="middle" font-size="11" fill="#94a3b8">crash recovery</text><path d="M34 221 l5 5 -5 5 -5 -5z" fill="#f5b942"/><text x="50" y="230" font-size="13.5" fill="#cbd5e1">Exactly-once execution via DB pessimistic locking</text><path d="M34 248 l5 5 -5 5 -5 -5z" fill="#f5b942"/><text x="50" y="257" font-size="13.5" fill="#cbd5e1">Custom RBAC across tenants, with full audit log</text><path d="M34 275 l5 5 -5 5 -5 -5z" fill="#f5b942"/><text x="50" y="284" font-size="13.5" fill="#cbd5e1">Lua sliding-window rate limiter, fails open to DB</text><path d="M34 302 l5 5 -5 5 -5 -5z" fill="#f5b942"/><text x="50" y="311" font-size="13.5" fill="#cbd5e1">Per-tenant circuit breakers using Resilience4j</text><rect x="28" y="342" width="69" height="