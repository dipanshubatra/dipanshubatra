<svg xmlns="http://www.w3.org/2000/svg" width="240" height="230" viewBox="0 0 240 230">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#182a3d"/><stop offset="1" stop-color="#0a111d"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffdf9a"/><stop offset=".48" stop-color="#ffc45e"/><stop offset="1" stop-color="#a96a24"/></linearGradient>
 <radialGradient id="aura"><stop stop-color="#ffc45e" stop-opacity=".3"/><stop offset="1" stop-color="#ffc45e" stop-opacity="0"/></radialGradient>
 <linearGradient id="shine"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <clipPath id="clip"><rect x="4" y="4" width="232" height="222" rx="19"/></clipPath>
</defs>
<style>
 text{font-family:Arial,Helvetica,sans-serif}
 .float{transform-box:fill-box;transform-origin:center;animation:float 3.6s ease-in-out infinite;animation-delay:-0.22s}
 .aura{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s ease-in-out infinite}
 .shine{animation:sweep 4.8s ease-in-out infinite;animation-delay:-0.22s}
 .spark1{animation:twinkle 2.4s ease-in-out infinite}
 .spark2{animation:twinkle 3.1s ease-in-out .8s infinite}
 .edge{animation:edge 3.2s ease-in-out infinite}
 @keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-7px) rotate(1deg)}}
 @keyframes pulse{0%,100%{opacity:.45;transform:scale(.92)}50%{opacity:1;transform:scale(1.08)}}
 @keyframes sweep{0%{transform:translateX(-310px) skewX(-18deg)}65%,100%{transform:translateX(330px) skewX(-18deg)}}
 @keyframes twinkle{0%,100%{opacity:.15}50%{opacity:1}}
 @keyframes edge{0%,100%{stroke-opacity:.35}50%{stroke-opacity:.9}}
 @media (prefers-reduced-motion:reduce){.float,.aura,.shine,.spark1,.spark2,.edge{animation:none}}
</style>
<rect x="4" y="4" width="232" height="222" rx="19" fill="url(#bg)" stroke="#ffc45e" stroke-opacity=".38" class="edge"/>
<rect x="5" y="5" width="230" height="220" rx="18" fill="url(#aura)" class="aura"/>
<g clip-path="url(#clip)">
 <circle cx="29" cy="34" r="1.5" fill="#fff" class="spark1"/><circle cx="205" cy="48" r="1.4" fill="#fff" class="spark2"/>
 <circle cx="26" cy="174" r="1.2" fill="#fff" class="spark2"/><circle cx="215" cy="185" r="1.5" fill="#fff" class="spark1"/>
 <path d="M-60 0 L-15 0 L-95 230 L-140 230Z" fill="url(#shine)" class="shine"/>
</g>
<g class="float">
 <circle cx="120" cy="83" r="47" fill="#ffc45e" opacity=".08"/>
 <circle cx="120" cy="83" r="39" fill="none" stroke="#ffc45e" stroke-opacity=".25"/>
 <!-- trophy handles -->
 <path d="M89 55 C62 49 66 91 98 94 M151 55 C178 49 174 91 142 94" fill="none" stroke="url(#metal)" stroke-width="8" stroke-linecap="round"/>
 <path d="M90 52 Q90 48 97 48 H143 Q150 48 150 55 L146 83 Q141 105 120 111 Q99 105 94 83Z" fill="url(#metal)" stroke="#ffdf9a" stroke-width="1.5"/>
 <path d="M103 57 Q108 54 112 57 L108 91 Q106 96 102 91Z" fill="#fff" opacity=".55"/>
 <path d="M128 56 L140 55 L135 91 Q133 96 129 94Z" fill="#fff" opacity=".24"/>
 <path d="M116 110 H124 V125 H116Z" fill="url(#metal)"/>
 <path d="M103 124 Q120 119 137 124 L141 132 H99Z" fill="url(#metal)"/>
 <rect x="92" y="133" width="56" height="8" rx="3" fill="#a96a24"/>
 <rect x="98" y="134" width="44" height="3" rx="1.5" fill="#ffdf9a" opacity=".8"/>
</g>
<rect x="17" y="151" width="206" height="1" fill="#ffc45e" opacity=".3"/>
<rect x="17" y="164" width="6" height="6" rx="3" fill="#ffc45e"/>
<text x="31" y="170" font-size="10" font-weight="700" letter-spacing="1.3" fill="#ffc45e">WINNER</text>
<text x="120" y="195" font-size="15" font-weight="700" text-anchor="middle" fill="#f3f7fc">Hackastra</text>
<text x="120" y="212" font-size="10.5" text-anchor="middle" fill="#a8bacd">NIT Durgapur</text>
</svg>